<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VocaBot ITCJ</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #1A0A00;
  --surface:   #2A1200;
  --bot:       #3D1A00;
  --user:      #8B2500;
  --accent:    #FF6B1A;
  --accent2:   #FFB380;
  --accent-lt: #FF8C42;
  --txt:       #FFF0E6;
  --txt2:      #CC8866;
  --opt-bg:    #2A1200;
  --opt-bdr:   #5C2A00;
  --red:       #CC0000;
  --red-dark:  #8B0000;
  --radius:    16px;
}
html,body { height:100%; font-family:'Inter',sans-serif; background:var(--bg); color:var(--txt); overflow:hidden; }

.screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .35s ease,transform .35s ease; }
.screen.hidden { opacity:0; pointer-events:none; transform:scale(.97); }

#welcome { background:linear-gradient(160deg,#CC0000 0%,#8B0000 55%,#3a0000 100%); padding:24px; }
.welcome-card { display:flex; flex-direction:column; align-items:center; gap:16px; max-width:300px; width:100%; }
.welcome-mascot { filter:drop-shadow(0 8px 24px rgba(0,0,0,.35)); }
.welcome-title { font-size:22px; font-weight:700; color:white; text-align:center; line-height:1.3; }
.welcome-sub { font-size:14px; color:rgba(255,255,255,.78); text-align:center; line-height:1.65; max-width:240px; }
.welcome-btn { background:white; color:var(--red); border:none; padding:14px 36px; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; box-shadow:0 4px 14px rgba(0,0,0,.25); transition:transform .12s,opacity .12s; margin-top:4px; }
.welcome-btn:hover { opacity:.9; transform:translateY(-1px); }
.welcome-note { font-size:11px; color:rgba(255,255,255,.5); text-align:center; }

#chatscreen { background:var(--bg); justify-content:flex-start; }
.layout { display:flex; flex-direction:column; height:100%; width:100%; max-width:480px; margin:0 auto; }

.header { flex-shrink:0; background:var(--surface); padding:10px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #5C2A00; }
.hav { width:36px; height:36px; border-radius:50%; background:var(--red); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
.header-name { font-size:14px; font-weight:600; color:var(--txt); }
.header-sub  { font-size:11px; color:var(--accent); margin-top:1px; }

.progress-bar  { flex-shrink:0; height:3px; background:#5C2A00; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),#FFD700); transition:width .5s ease; width:0%; }

.chat-wrap { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
.chat { padding:14px 12px 10px; display:flex; flex-direction:column; gap:10px; min-height:100%; }

.bubble { max-width:84%; padding:11px 14px; border-radius:var(--radius); font-size:14px; line-height:1.55; animation:fadeUp .25s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.bubble.bot  { background:var(--bot); color:var(--txt); border-bottom-left-radius:4px; align-self:flex-start; border:1px solid #5C2A00; }
.bubble.user { background:var(--user); color:var(--accent2); border-bottom-right-radius:4px; align-self:flex-end; font-weight:500; }

.typing { display:flex; gap:5px; align-items:center; padding:13px 14px; background:var(--bot); border-radius:var(--radius); border-bottom-left-radius:4px; align-self:flex-start; width:fit-content; border:1px solid #5C2A00; }
.typing span { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:blink 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

.options-panel { flex-shrink:0; background:var(--bg); border-top:1px solid #5C2A00; padding:10px 12px 18px; display:flex; flex-direction:column; gap:7px; max-height:58vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.opt { background:var(--opt-bg); border:1px solid var(--opt-bdr); color:var(--txt); padding:11px 14px; border-radius:12px; font-size:13.5px; line-height:1.4; cursor:pointer; transition:background .15s,border-color .15s,transform .1s; text-align:left; font-family:'Inter',sans-serif; width:100%; }
.opt:hover { background:rgba(255,107,26,.15); border-color:var(--accent); }
.opt:active { transform:translateY(1px); }

.input-box { width:100%; padding:12px; border-radius:12px; border:1px solid var(--opt-bdr); background:var(--surface); color:var(--txt); font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:border-color .2s; }
.input-box:focus { border-color:var(--accent); }

.rank-info { font-size:11px; color:var(--txt2); font-style:italic; padding:2px; }
.opt.rank-opt { display:flex; align-items:center; gap:10px; }
.rank-badge { min-width:24px; height:24px; border-radius:50%; border:1.5px solid var(--opt-bdr); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--txt2); flex-shrink:0; transition:all .2s; }
.opt.ranked .rank-badge { background:rgba(255,107,26,.25); border-color:var(--accent); color:var(--accent); }
.opt.ranked { border-color:rgba(255,107,26,.4); opacity:.75; }
.confirm-btn { background:var(--accent); color:white; border:none; padding:12px; border-radius:12px; font-size:14px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; transition:opacity .15s; }
.confirm-btn:disabled { opacity:.3; cursor:not-allowed; }

.result-card { background:var(--surface); border:1px solid var(--accent); border-radius:20px; padding:20px; margin-top:4px; animation:fadeUp .4s ease; align-self:stretch; }
.result-label { font-size:11px; color:var(--accent); font-weight:600; letter-spacing:.07em; margin-bottom:4px; }
.result-title { font-size:19px; font-weight:700; margin-bottom:3px; color:var(--txt); }
.result-sub   { font-size:12px; color:var(--txt2); margin-bottom:12px; }
.dim-bar { margin-bottom:14px; }
.dim-title { font-size:11.5px; font-weight:600; color:var(--txt2); margin-bottom:8px; }
.dim-item { margin-bottom:6px; }
.dim-label { display:flex; justify-content:space-between; font-size:12px; color:var(--txt); margin-bottom:3px; }
.dim-track { height:6px; background:#5C2A00; border-radius:3px; overflow:hidden; }
.dim-fill  { height:100%; border-radius:3px; background:linear-gradient(90deg,var(--accent),#FFD700); transition:width .8s ease; }
.careers-section { margin-bottom:12px; }
.careers-title { font-size:11.5px; font-weight:600; color:var(--txt2); margin-bottom:8px; }
.career-item { display:flex; align-items:center; gap:8px; padding:8px 10px; background:rgba(255,107,26,.08); border-radius:10px; margin-bottom:5px; border:1px solid rgba(255,107,26,.2); }
.career-emoji { font-size:16px; flex-shrink:0; }
.career-name { font-size:13px; color:var(--txt); font-weight:500; }
.career-match { font-size:11px; color:var(--accent); margin-left:auto; font-weight:600; }

.link-carreras-btn { display:block; text-align:center; background:rgba(255,107,26,.15); border:1px solid var(--accent); color:var(--accent-lt); text-decoration:none; padding:10px; border-radius:10px; font-size:12.5px; font-weight:600; margin-top:10px; transition:background .2s; }
.link-carreras-btn:hover { background:rgba(255,107,26,.25); }

.sports-section { margin-bottom:12px; padding:12px; background:rgba(255,107,26,.08); border-radius:12px; border:1px solid rgba(255,107,26,.2); margin-top:12px; }
.sports-title { font-size:11.5px; font-weight:600; color:var(--accent); margin-bottom:6px; }
.sports-list { font-size:12.5px; color:var(--txt); line-height:1.7; }
.disclaimer { font-size:11px; color:var(--txt2); line-height:1.5; margin-top:10px; padding:9px 11px; background:rgba(255,255,255,.03); border-radius:10px; }
.restart-btn { margin-top:12px; width:100%; background:transparent; border:1px solid var(--opt-bdr); color:var(--txt2); padding:11px; border-radius:12px; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; transition:border-color .2s,color .2s; }
.restart-btn:hover { border-color:var(--accent); color:var(--accent); }

@media(prefers-reduced-motion:no-preference){
  #wg { transform-origin:50% 85%; animation:wave 1.3s ease-in-out infinite; }
  @keyframes wave{0%{transform:rotate(0deg)}20%{transform:rotate(-30deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-24deg)}80%{transform:rotate(6deg)}100%{transform:rotate(0deg)}}
  #ebl,#ebr { animation:eblink 4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  #ebr { animation-delay:.07s; }
  @keyframes eblink{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(0.07)}}
}
</style>
</head>

let scores   = {TC:0,DL:0,EP:0,OO:0,AA:0,ES:0,RI:0};
let answers  = {};
let eval1 = "";
let eval2 = "";
let eval3 = "";
let eval4 = "";
let contactoUsuario = "";
let carreraActualITCJ = "";
let startTime;
let currentQ = -1;

const chatEl   = document.getElementById('chat');
const chatWrap = document.getElementById('chat-wrap');
const optPanel = document.getElementById('options-panel');
const progEl   = document.getElementById('progress');

document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('chatscreen').classList.remove('hidden');
  startTime = new Date();
  setTimeout(askCarreraActual, 300);
});

function scrollBottom(){ setTimeout(()=>{ chatWrap.scrollTop=chatWrap.scrollHeight; },80); }
function clearOpts(){ optPanel.innerHTML=''; }

function addBubble(text,type){
  return new Promise(resolve=>{
    const b=document.createElement('div');
    b.className=`bubble ${type}`; b.textContent=text;
    chatEl.appendChild(b); scrollBottom(); setTimeout(resolve,60);
  });
}

function showTyping(dur=700){
  return new Promise(resolve=>{
    const t=document.createElement('div');
    t.className='typing'; t.id='typ';
    t.innerHTML='<span></span><span></span><span></span>';
    chatEl.appendChild(t); scrollBottom();
    setTimeout(()=>{ const e=document.getElementById('typ'); if(e)e.remove(); resolve(); },dur);
  });
}

function updateProgress(){
  const pct = Math.min(100, Math.round(((currentQ + 1) / QUESTIONS.length) * 100));
  progEl.style.width=pct+'%';
}

async function askCarreraActual(){

  await addBubble("¡Hola! Estás utilizando la versión de diagnóstico para estudiantes de nuevo ingreso. Para comenzar, ¿qué carrera estás cursando actualmente en el ITCJ?", "bot");
  
  clearOpts();

    "Ingeniería Mecánica",

    "Ingeniería Industrial",

    "Ingeniería en Mecatrónica",

    }

async function startChat(){
  await showTyping(600);
  await addBubble("Recuerda: no hay respuestas correctas ni incorrectas. Solo sé honesto contigo mismo, no con quien quieres ser.", "bot");
  
  clearOpts();
  const btn = document.createElement('button');
  btn.className = 'opt';
  btn.style.textAlign = 'center';
  btn.style.fontWeight = '600';
  btn.textContent = "Entendido, ¡vamos! 👊";
  btn.addEventListener('click', async () => {
    clearOpts();
    await addBubble("Entendido, ¡vamos! 👊", "user");
    setTimeout(nextQuestion, 300);
  });
  optPanel.appendChild(btn);
}

function showSingle(q,onDone){
  clearOpts();
  q.opts.forEach((opt)=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.textContent=opt.text;
    btn.addEventListener('click',async()=>{
      clearOpts();
      answers[`P${currentQ+1}`]=opt.text;
      await addBubble(opt.text,'user');
      Object.entries(opt.scores).forEach(([k,v])=>scores[k]+=v);
      onDone();
    });
    optPanel.appendChild(btn);
  });
}

function showRank(q,onDone){
  clearOpts();
  const info=document.createElement('div');
  info.className='rank-info';
  info.textContent='Toca en orden: primero el que más te representa. Toca de nuevo para quitar.';
  optPanel.appendChild(info);
  let order=[];
  const btns=q.opts.map((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='opt rank-opt';
    const badge=document.createElement('span'); badge.className='rank-badge'; badge.textContent='?';
    const label=document.createElement('span'); label.style.flex='1'; label.textContent=opt.text;
    btn.appendChild(badge); btn.appendChild(label);
    btn.addEventListener('click',()=>{
      const pos=order.indexOf(i);
      if(pos===-1){
        order.push(i); btn.classList.add('ranked'); badge.textContent=order.length;
      } else {
        order.splice(pos,1); btn.classList.remove('ranked'); badge.textContent='?';
        order.forEach((idx,np)=>{ btns[idx].querySelector('.rank-badge').textContent=np+1; });
      }
      confirmBtn.disabled=(order.length<q.opts.length);
    });
    optPanel.appendChild(btn); return btn;
  });
  const confirmBtn=document.createElement('button');
  confirmBtn.className='confirm-btn'; confirmBtn.textContent='Confirmar orden ✓'; confirmBtn.disabled=true;
  confirmBtn.addEventListener('click',async()=>{
    clearOpts();
    const top=q.opts[order[0]].text;
    answers[`P${currentQ+1}`]=order.map((idx,pos)=>`${pos+1}°${q.opts[idx].text.substring(0,20)}`).join('|');
    await addBubble(`1° ${top.substring(0,45)}${top.length>45?'…':''}`, 'user');
    order.forEach((itemIdx,pos)=>{
      const pts=q.rankScores[pos]??0;
      Object.keys(q.opts[itemIdx].keys).forEach(k=>{ scores[k]+=pts; });
    });
    onDone();
  });
  optPanel.appendChild(confirmBtn);
}

async function nextQuestion(){
  currentQ++;
  if(currentQ >= QUESTIONS.length){ 
    progEl.style.width='100%';
    showResult(); 
    return; 
  }
  updateProgress();
  const q=QUESTIONS[currentQ];
  await showTyping(650);
  await addBubble(q.q,'bot'); scrollBottom();
  if(q.type==='single') showSingle(q,()=>setTimeout(nextQuestion,350));
  else                   showRank(q,  ()=>setTimeout(nextQuestion,350));
}

function getTopDims(n){ return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,n); }

function scoreCareer(carrera){
  const topDims=getTopDims(3).map(d=>d[0]);
  let total=0;
  topDims.forEach((dim,i)=>{
    const w=[3,2,1][i];
    total+=(carrera.dims[dim]||0)*w;
  });
  return total;
}

function getTopCareers(n){
  return CARRERAS.map(c=>({...c, score:scoreCareer(c)}))
    .sort((a,b)=>b.score-a.score).slice(0,n);
}

function getMaxScore(){
  const maxVal=Math.max(...Object.values(scores));
  return maxVal||1;
}

// ENVÍO AL SCRIPT DE NUEVO INGRESO
async function sendToSheets(top1, topCareers){
  if(!SHEETS_URL) return;
  const endTime = new Date();
  const durationSec = Math.round((endTime - startTime) / 1000);
  
  const params = new URLSearchParams();
  params.append('timestamp', new Date().toISOString());
  params.append('duracion_segundos', durationSec);
  params.append('carrera_actual', carreraActualITCJ || 'No especificada');
  params.append('perfil_principal', top1.label);
  params.append('carrera_top1', topCareers[0]?.name || '');
  params.append('carrera_top2', topCareers[1]?.name || '');
  params.append('carrera_top3', topCareers[2]?.name || '');
  params.append('coincide_carrera_actual', eval1);
  params.append('alineacion_talentos', eval2);
  params.append('utilidad_pre_inscripcion', eval3);
  params.append('deseo_tutoria', eval4);
  params.append('contacto_seguimiento', contactoUsuario || 'No proporcionado');
  params.append('scores', JSON.stringify(scores));
  params.append('respuestas', JSON.stringify(answers));

  try {
    await fetch(SHEETS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: params.toString()
    });
  } catch(e) {
    console.error("Error enviando datos:", e);
  }
}

async function showResult(){
  clearOpts(); 
  await showTyping(1000);
  await addBubble('¡Listo! He analizado tus respuestas. Aquí están tus resultados:','bot');
  await new Promise(r=>setTimeout(r,400));

  const topDims=getTopDims(3);
  const topCareers=getTopCareers(5);
  const maxScore=getMaxScore();
  const top1=DIMS[topDims[0][0]];

  const card=document.createElement('div');
  card.className='result-card';

  const dimsHTML=topDims.map(([k,v])=>{
    const d=DIMS[k];
    const pct=Math.round((v/maxScore)*100);
    return `<div class="dim-item">
      <div class="dim-label"><span>${d.emoji} ${d.label}</span><span>${pct}%</span></div>
      <div class="dim-track"><div class="dim-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  const labels=['Muy alto','Alto','Bueno','Compatible','Compatible'];
  const careersHTML=topCareers.map((c,i)=>{
    return `<div class="career-item">
      <span class="career-emoji">${c.emoji}</span>
      <span class="career-name">${c.name}</span>
      <span class="career-match">${labels[i]}</span>
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="result-label">TU PERFIL PRINCIPAL</div>
    <div class="result-title">${top1.emoji} ${top1.label}</div>
    <div class="result-sub">${top1.desc}</div>
    
    <div class="dim-bar">
      <div class="dim-title">TUS DIMENSIONES DESTACADAS</div>
      ${dimsHTML}
    </div>

    <div class="careers-section">
      <div class="careers-title">CARRERAS SUGERIDAS EN EL ITCJ</div>
      ${careersHTML}
      <a href="https://cdjuarez.tecnm.mx/programas_academicos/" target="_blank" class="link-carreras-btn">
        🌐 Ver planes de estudio completos del ITCJ
      </a>
    </div>

    <div class="sports-section">
      <div class="sports-title">⚽ ACTIVIDADES EXTRAESCOLARES</div>
      <div class="sports-list">${SPORTS_MSG}</div>
    </div>

    <div class="disclaimer">
      💡 <strong>Nota:</strong> Este test es una orientación inicial basada en tus preferencias actuales y no reemplaza el diagnóstico de un profesional vocacional.
    </div>
  `;

  chatEl.appendChild(card);
  scrollBottom();

  setTimeout(() => askEval1(top1, topCareers), 1200);
}

async function askSeguimiento(top1, topCareers){
  await showTyping(700);
  await addBubble('📋 ¿Nos autorizas un medio de contacto (correo o teléfono) para futuras investigaciones relacionadas con el acompañamiento estudiantil? (Opcional):', 'bot');
  clearOpts();

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Ej: 6561234567 o correo@ejemplo.com';
  input.className = 'input-box';

  const sendBtn = document.createElement('button');
  sendBtn.className = 'confirm-btn';
  sendBtn.textContent = 'Sí, autorizo 📩';
  sendBtn.onclick = async () => {
    const valor = input.value.trim();
    if (valor === '') {
      input.style.borderColor = '#FF5555';
      input.placeholder = 'Ingresa un dato o selecciona "No por ahora"';
      return;
    }
    contactoUsuario = valor;
    clearOpts();
    await addBubble(contactoUsuario, 'user');
    finishSurvey(top1, topCareers);
  };

  const skipBtn = document.createElement('button');
  skipBtn.className = 'opt';
  skipBtn.style.textAlign = 'center';
  skipBtn.style.marginTop = '4px';

    contactoUsuario = 'No proporcionado';
    clearOpts();
    await addBubble('No por ahora', 'user');
    finishSurvey(top1, topCareers);
  };

  optPanel.appendChild(input);
  optPanel.appendChild(sendBtn);
  optPanel.appendChild(skipBtn);
}

  restartBtn.className = 'restart-btn';

  optPanel.appendChild(restartBtn);
}
